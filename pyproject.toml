[project]
name = "hlscout"
version = "0.1.0"
description = "Read-only Hyperliquid perp trader scanner"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.7",
  "pyyaml>=6",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=16",
  "typer>=0.12",
  "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
hlscout = "hlscout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hlscout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["FURB192"]
